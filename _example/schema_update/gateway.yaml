endpoint: /graphql
port: 9000
service_name: schema-update-demo
timeout_duration: "5s"
request_timeout: "30s"
enable_hang_over_request_header: false
services:
  # When running with docker compose, use service names (products, reviews).
  # When running locally (go run), use localhost.
  - name: products
    host: http://products:8501/query
    retry:
      attempts: 3
      timeout: "5s"
  - name: reviews
    host: http://reviews:8502/query
    retry:
      attempts: 3
      timeout: "5s"
opentelemetry:
  tracing:
    enable: false

connection_pool:
  max_idle_conns_per_host: 32
  max_conns_per_host: 0
  idle_conn_timeout: "90s"

admin:
  auth:
    # Token for POST /{name}/apply. Can also be overridden by the
    # GATEWAY_ADMIN_TOKEN environment variable.
    token: "e2e-admin-token"
