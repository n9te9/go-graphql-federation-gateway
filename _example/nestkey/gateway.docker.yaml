endpoint: /graphql
port: 9000
service_name: nestkey-gateway
timeout_duration: "5s"
request_timeout: "30s"
services:
- name: locations
  host: http://locations:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: weather
  host: http://weather:8080/query
  retry:
    attempts: 3
    timeout: "5s"
