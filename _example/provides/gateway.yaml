endpoint: /graphql
port: 9000
service_name: provides-gateway
timeout_duration: "5s"
request_timeout: "30s"
services:
- name: posts
  host: http://localhost:8901/query
  retry:
    attempts: 3
    timeout: "5s"
- name: users
  host: http://localhost:8902/query
  retry:
    attempts: 3
    timeout: "5s"

connection_pool:
  max_idle_conns_per_host: 32
  max_conns_per_host: 0
  idle_conn_timeout: "90s"
