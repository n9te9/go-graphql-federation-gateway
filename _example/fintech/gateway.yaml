endpoint: /graphql
port: 9000
service_name: fintech-gateway
timeout_duration: "5s"
request_timeout: "30s"
services:
- name: customers
  host: http://localhost:8201/query
  retry:
    attempts: 3
    timeout: "5s"
- name: accounts
  host: http://localhost:8202/query
  retry:
    attempts: 3
    timeout: "5s"
- name: transactions
  host: http://localhost:8203/query
  retry:
    attempts: 3
    timeout: "5s"
- name: audit
  host: http://localhost:8204/query
  retry:
    attempts: 3
    timeout: "5s"
- name: customers-eu
  host: http://localhost:8205/query
  retry:
    attempts: 3
    timeout: "5s"
- name: activities
  host: http://localhost:8206/query
  retry:
    attempts: 3
    timeout: "5s"

connection_pool:
  max_idle_conns_per_host: 32
  max_conns_per_host: 0
  idle_conn_timeout: "90s"
