endpoint: /graphql
port: 9000
service_name: go-graphql-federation-gateway
timeout_duration: "5s"
request_timeout: "30s"
enable_complement_request_id: false
enable_hang_over_request_header: false
services:
- name: products
  host: http://products:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: reviews
  host: http://reviews:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: users
  host: http://users:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: inventory
  host: http://inventory:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: catalog
  host: http://catalog:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: products-v2
  host: http://products-v2:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: search
  host: http://search:8080/query
  retry:
    attempts: 3
    timeout: "5s"
opentelemetry:
  tracing:
    enable: false
