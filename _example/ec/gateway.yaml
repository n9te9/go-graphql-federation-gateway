endpoint: /graphql
port: 9000
service_name: go-graphql-federation-gateway
timeout_duration: "5s"
request_timeout: "30s"
enable_complement_request_id: false
enable_hang_over_request_header: false
enable_introspection: true
services:
- name: products
  host: http://localhost:8101/query
  retry:
    attempts: 3
    timeout: "5s"
- name: reviews
  host: http://localhost:8102/query
  retry:
    attempts: 3
    timeout: "5s"
- name: users
  host: http://localhost:8103/query
  retry:
    attempts: 3
    timeout: "5s"
- name: inventory
  host: http://localhost:8104/query
  retry:
    attempts: 3
    timeout: "5s"
- name: catalog
  host: http://localhost:8105/query
  retry:
    attempts: 3
    timeout: "5s"
- name: products-v2
  host: http://localhost:8106/query
  retry:
    attempts: 3
    timeout: "5s"
- name: search
  host: http://localhost:8107/query
  retry:
    attempts: 3
    timeout: "5s"
opentelemetry:
  tracing:
    enable: true

connection_pool:
  max_idle_conns_per_host: 32
  max_conns_per_host: 0
  idle_conn_timeout: "90s"
