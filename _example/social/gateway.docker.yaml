endpoint: /graphql
port: 9000
service_name: social-gateway
timeout_duration: "5s"
request_timeout: "30s"
services:
- name: users
  host: http://users:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: posts
  host: http://posts:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: comments
  host: http://comments:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: feed
  host: http://feed:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: moderation
  host: http://moderation:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: notifications
  host: http://notifications:8080/query
  retry:
    attempts: 3
    timeout: "5s"
