  retry:
    attempts: 3
    timeout: "5s"
- name: billing
  host: http://billing:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: resources
  host: http://resources:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: billing-v2
  host: http://billing-v2:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: events
  host: http://events:8080/query
  retry:
    attempts: 3
    timeout: "5s"
