endpoint: /graphql
port: 9000
service_name: saas-gateway
timeout_duration: "5s"
request_timeout: "30s"
services:
- name: organizations
  host: http://localhost:8501/query
  retry:
    attempts: 3
    timeout: "5s"
- name: projects
  host: http://localhost:8502/query
  retry:
    attempts: 3
    timeout: "5s"
- name: billing
  host: http://localhost:8503/query
  retry:
    attempts: 3
    timeout: "5s"
- name: resources
  host: http://localhost:8504/query
  retry:
    attempts: 3
    timeout: "5s"
- name: billing-v2
  host: http://localhost:8505/query
  retry:
    attempts: 3
    timeout: "5s"
- name: events
  host: http://localhost:8506/query
  retry:
    attempts: 3
    timeout: "5s"

connection_pool:
  max_idle_conns_per_host: 32
  max_conns_per_host: 0
  idle_conn_timeout: "90s"
