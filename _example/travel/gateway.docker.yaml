    attempts: 3
    timeout: "5s"
- name: bookings
  host: http://bookings:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: bookables
  host: http://bookables:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: hotels
  host: http://hotels:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: pricing
  host: http://pricing:8080/query
  retry:
    attempts: 3
    timeout: "5s"
- name: search
  host: http://search:8080/query
  retry:
    attempts: 3
    timeout: "5s"
